<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusOS - Premium Student Directory</title>
  <!-- Google Fonts: Inter and Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.4.2/css/all.css">
  <!-- Custom CSS3 Premium Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  
  <!-- Dynamic Application Layout Wrapper -->
  <div id="app-container">
    
    <!-- Dynamic View Injection Target -->
    <div id="view-target">
      <!-- Injected dynamically by app.js (SaaS Landing Page OR Portal Workspace) -->
      <div class="view-loader">
        <i class="fa-solid fa-circle-notch fa-spin"></i>
        <span>Launching CampusOS...</span>
      </div>
    </div>
    
  </div>

  <!-- Notion-Style Profile Details Slide-Out Drawer -->
  <div class="drawer-overlay" id="drawer-overlay"></div>
  <div class="details-drawer" id="details-drawer">
    <div class="drawer-header">
      <div class="drawer-header-left">
        <i class="fa-solid fa-user-graduate"></i>
        <span>Student Profile</span>
      </div>
      <button class="drawer-close" id="btn-drawer-close">&times;</button>
    </div>
    <div class="drawer-body" id="drawer-body-content">
      <!-- Populated dynamically -->
    </div>
  </div>

  <!-- Delete Confirmation Modal (Frosted Alert overlay) -->
  <div class="modal-overlay" id="delete-modal">
    <div class="modal-card">
      <div class="modal-header warning">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <h2>Confirm Deletion</h2>
      </div>
      <div class="modal-body">
        <p>Are you sure you want to permanently delete this student record? This action is irreversible.</p>
        <div class="student-delete-preview" id="delete-preview-box">
          <!-- Populated dynamically -->
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="btn-delete-cancel">Cancel</button>
        <button class="btn btn-danger" id="btn-delete-confirm">Delete Record</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Stack Container -->
  <div id="toast-container"></div>

  <!-- Chart.js Visualization Library CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Application Scripts -->
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
